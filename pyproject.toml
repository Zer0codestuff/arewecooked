[project]
name = "arewecooked-pipeline"
version = "0.1.0"
description = "Data pipeline for the AreWeCooked? cybersecurity data story"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "requests>=2.32",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# extra libraries used by pipeline/steps (the data-story build for the website)
story = ["pyarrow>=16", "duckdb>=1.0", "pyyaml>=6", "pdfplumber>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
